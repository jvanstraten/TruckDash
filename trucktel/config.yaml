---
# Which port the server should listen on.
port: 8080

# Which content types the static server should use. 'if' is a regex that's
# matched against the filename; if it matches, the content type in 'then'
# is sent.
content-types:
  - if: .*\.html?
    then: text/html; charset=utf-8
  - if: .*\.json
    then: application/json; charset=utf-8
  - if: .*\.js
    then: text/javascript; charset=utf-8
  - if: .*\.css
    then: text/css; charset=utf-8
  - if: .*\.svg
    then: image/svg+xml; charset=utf-8
  - if: .*\.png
    then: image/png
  - if: .*\.jpe?g
    then: image/jpeg
  - if: .*\.gif
    then: image/gif
  - if: .*\.ico
    then: image/vnd.microsoft.icon

custom-structures:
  dash:
    paused:
      key: frame.paused
    time:
      key: game.time
    job_expected:
      key: job.delivery.time
    rest_remain:
      key: rest.stop
    nav_remain_time:
      key: truck.navigation.time
      scale: 0.016666666666666666
      operator: round
    nav_remain_dist:
      key: truck.navigation.distance
      scale: 0.001
      operator: round

input:
  binary:
    engine: Toggle engine power
